frr version 8.4
hostname r6
service integrated-vtysh-config

! eBGP Proveidors
route-map ROUTE_MAP_IN permit 10
exit

#Nomes compartim els prefixes dels nostres clients
ip prefix-list CLIENTS permit 110.10.0.0/23 ge 23 le 24
ip prefix-list CLIENTS permit 120.20.0.0/23 ge 23 le 24
ip prefix-list CLIENTS permit 130.30.0.0/23 ge 23 le 24
ip prefix-list CLIENTS permit 140.40.0.0/23 ge 23 le 24
ip prefix-list CLIENTS permit 150.50.0.0/23 ge 23 le 24
ip prefix-list CLIENTS permit 160.60.0.0/23 ge 23 le 24
ip prefix-list CLIENTS permit 170.70.0.0/23 ge 23 le 24
ip prefix-list CLIENTS permit 180.80.0.0/23 ge 23 le 24
ip prefix-list CLIENTS permit 190.90.0.0/23 ge 23 le 24

route-map ROUTE_MAP_OUT permit 10
 match ip address prefix-list CLIENTS
exit


router bgp 205718
 bgp router-id 1.0.0.0
 bgp fast-external-failover
 no bgp ebgp-requires-policy
 redistribute static

 ! Hurricane
 neighbor 10.0.1.2 remote-as 6939
 neighbor 10.0.1.2 description eBGP_Hurricane
 neighbor 10.0.1.2 bfd

 ! Orange/Jazztel
 neighbor 10.0.2.2 remote-as 3352
 neighbor 10.0.2.2 description eBGP_OrangeJazztel
 neighbor 10.0.2.2 bfd
 
 ! Espanix
 neighbor 10.0.3.2 remote-as 65010
 neighbor 10.0.3.2 description eBGP_Espanix
 neighbor 10.0.3.2 bfd
 
 ! Google
 neighbor 10.0.4.2 remote-as 15169
 neighbor 10.0.4.2 description eBGP_Google_0
 neighbor 10.0.4.2 bfd

 neighbor 10.1.4.2 remote-as 15169
 neighbor 10.1.4.2 description eBGP_Google_1
 neighbor 10.1.4.2 bfd
 
 ! Netflix
 neighbor 10.0.5.2 remote-as 2906
 neighbor 10.0.5.2 description eBGP_Netflix_0
 neighbor 10.0.5.2 bfd
 
 neighbor 10.1.5.2 remote-as 2906
 neighbor 10.1.5.2 description eBGP_Netflix_1
 neighbor 10.1.5.2 bfd
 
 neighbor 10.2.5.2 remote-as 2906
 neighbor 10.2.5.2 description eBGP_Netflix_2
 neighbor 10.2.5.2 bfd
 
 ! Meta
 neighbor 10.0.6.2 remote-as 32934
 neighbor 10.0.6.2 description eBGP_Meta_0
 neighbor 10.0.6.2 bfd

 neighbor 10.1.6.2 remote-as 32934
 neighbor 10.1.6.2 description eBGP_Meta_1
 neighbor 10.1.6.2 bfd
 
 neighbor 10.2.6.2 remote-as 32934
 neighbor 10.2.6.2 description eBGP_Meta_2
 neighbor 10.2.6.2 bfd

 address-family ipv4 unicast
 
  network 110.10.0.0/23
  network 120.20.0.0/23
  network 130.30.0.0/23
  network 140.40.0.0/23
  network 150.50.0.0/23
  network 160.60.0.0/23
  network 170.70.0.0/23
  network 180.80.0.0/23
  network 190.90.0.0/23

 ! Hurricane
  neighbor 10.0.1.2 activate
  neighbor 10.0.1.2 soft-reconfiguration inbound
  neighbor 10.0.1.2 route-map ROUTE_MAP_IN in
  neighbor 10.0.1.2 route-map ROUTE_MAP_OUT out

 ! Orange/Jazztel
  neighbor 10.0.2.2 activate
  neighbor 10.0.2.2 soft-reconfiguration inbound
  neighbor 10.0.2.2 route-map ROUTE_MAP_IN in
  neighbor 10.0.2.2 route-map ROUTE_MAP_OUT out

 ! Espanix
  neighbor 10.0.3.2 activate
  neighbor 10.0.3.2 soft-reconfiguration inbound
  neighbor 10.0.3.2 route-map ROUTE_MAP_IN in
  neighbor 10.0.3.2 route-map ROUTE_MAP_OUT out

 ! Google
  neighbor 10.0.4.2 activate
  neighbor 10.0.4.2 soft-reconfiguration inbound
  neighbor 10.0.4.2 route-map ROUTE_MAP_IN in
  neighbor 10.0.4.2 route-map ROUTE_MAP_OUT out

  neighbor 10.1.4.2 activate
  neighbor 10.1.4.2 soft-reconfiguration inbound
  neighbor 10.1.4.2 route-map ROUTE_MAP_IN in
  neighbor 10.1.4.2 route-map ROUTE_MAP_OUT out

 ! Netflix
  neighbor 10.0.5.2 activate
  neighbor 10.0.5.2 soft-reconfiguration inbound
  neighbor 10.0.5.2 route-map ROUTE_MAP_IN in
  neighbor 10.0.5.2 route-map ROUTE_MAP_OUT out

  neighbor 10.1.5.2 activate
  neighbor 10.1.5.2 soft-reconfiguration inbound
  neighbor 10.1.5.2 route-map ROUTE_MAP_IN in
  neighbor 10.1.5.2 route-map ROUTE_MAP_OUT out

  neighbor 10.2.5.2 activate
  neighbor 10.2.5.2 soft-reconfiguration inbound
  neighbor 10.2.5.2 route-map ROUTE_MAP_IN in
  neighbor 10.2.5.2 route-map ROUTE_MAP_OUT out
  
 ! Meta
  neighbor 10.0.6.2 activate
  neighbor 10.0.6.2 soft-reconfiguration inbound
  neighbor 10.0.6.2 route-map ROUTE_MAP_IN in
  neighbor 10.0.6.2 route-map ROUTE_MAP_OUT out
  
  neighbor 10.1.6.2 activate
  neighbor 10.1.6.2 soft-reconfiguration inbound
  neighbor 10.1.6.2 route-map ROUTE_MAP_IN in
  neighbor 10.1.6.2 route-map ROUTE_MAP_OUT out
  
  neighbor 10.2.6.2 activate
  neighbor 10.2.6.2 soft-reconfiguration inbound
  neighbor 10.2.6.2 route-map ROUTE_MAP_IN in
  neighbor 10.2.6.2 route-map ROUTE_MAP_OUT out
  
  
  bgp bestpath as-path multipath-relax
  maximum-paths 8

exit
